<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="ArtVault — Your private art collection manager. Track, catalogue, and manage your artwork with AI-powered insights.">
  <meta name="theme-color" content="#08090F">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://artvault-d69d0.web.app/">
  <meta property="og:title" content="ArtVault — Art Collection Manager">
  <meta property="og:description" content="Your private art collection manager. Track, catalogue, and manage your artwork with AI-powered insights.">
  <meta property="og:image" content="https://artvault-d69d0.web.app/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://artvault-d69d0.web.app/">
  <meta name="twitter:title" content="ArtVault — Art Collection Manager">
  <meta name="twitter:description" content="Your private art collection manager. Track, catalogue, and manage your artwork with AI-powered insights.">
  <meta name="twitter:image" content="https://artvault-d69d0.web.app/icons/Icon-512.png">

  <!--
    Content Security Policy is served as an HTTP header by firebase.json
    hosting headers (meta CSP cannot enforce frame-ancestors and is ignored
    by CSP scanners). The browser bootstrap inline scripts live in web/app.js
    so our own code needs no inline-script allowance; script-src still
    permits 'unsafe-inline' only because Google Identity Services
    (accounts.google.com/gsi/client) injects its own inline bootstrap
    scripts at runtime and does not support nonces/hashes reliably.
  -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ArtVault">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preconnect for faster first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://mtwinlbgvuxezadbsrrl.supabase.co">
  <title>ArtVault — Art Collection Manager</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Sign-In web client (used by google_sign_in on web). -->
  <meta name="google-signin-client_id" content="1:629393260589:web:c964a2dac4fad408fdb8a4">

  <!-- Prevent clickjacking (full enforcement needs server-side X-Frame-Options: DENY) -->
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
    /* Prevent FOUC */
    body { background: #08090F; }
    /* Smooth scroll for anchor links */
    html { scroll-behavior: smooth; }
  </style>

  <!-- Browser bootstrap helpers (session timeout, SW registration, splash,
       a11y viewport fix, sanitizer). External file keeps script-src free of
       'unsafe-inline'; see firebase.json Content-Security-Policy header. -->
  <script src="app.js"></script>
</head>
<body>
  <!-- Instant HTML splash while Flutter downloads (perceived fast) -->
  <div id="av-html-splash" style="position:fixed;inset:0;background:#05070F;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.45s ease;">
    <div style="width:112px;height:112px;border-radius:32px;background:linear-gradient(135deg,#8B5CF6,#22D3EE);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(139,92,246,0.40);animation:av-pulse 1.6s ease infinite alternate;">
      <span style="font-size:56px;line-height:1;">🎨</span>
    </div>
    <div style="margin-top:28px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#fff;">ArtVault</div>
    <div style="margin-top:6px;font-size:11px;letter-spacing:1.6px;font-weight:600;color:rgba(255,255,255,0.45);">PRIVATE GALLERY • 3D</div>
    <div style="margin-top:28px;width:32px;height:2px;border-radius:99px;background:linear-gradient(90deg,rgba(139,92,246,0.5),rgba(255,255,255,0.5),rgba(139,92,246,0.5));opacity:0.6;"></div>
    <div style="margin-top:12px;font-size:11px;letter-spacing:1.2px;color:rgba(255,255,255,0.35);">Loading your gallery…</div>
    <style>@keyframes av-pulse { from { transform:scale(0.97);} to { transform:scale(1.03);} }</style>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
