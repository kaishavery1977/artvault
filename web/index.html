  <script>
    // Session timeout: auto-logout after 30 minutes of inactivity
    (function() {
      var TIMEOUT_MS = 30 * 60 * 1000; // 30 minutes
      var timer;
      function resetTimer() {
        clearTimeout(timer);
        timer = setTimeout(function() {
          // Clear Firebase auth persistence
          try {
            localStorage.removeItem('firebase:authUser:AIzaSyAlEmaqwhaF9X49NX56Z5CtgznjYsa3r-Q:[DEFAULT]');
            sessionStorage.clear();
          } catch(e) {}
          // Reload to trigger auth state check
          window.location.reload();
        }, TIMEOUT_MS);
      }
      // Reset on any user activity
      ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart'].forEach(function(evt) {
        document.addEventListener(evt, resetTimer, { passive: true });
      });
      resetTimer();
    })();
  </script>

  <script>
    // Input sanitization helper — strips HTML tags from user input
    window.artvaultSanitize = function(str) {
      if (!str) return str;
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    };
  </script>

  <script>
    // Register service worker for offline support + push notifications
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          console.log('[ArtVault] Service worker registered, scope:', reg.scope);
        }).catch(function(err) {
          console.warn('[ArtVault] SW registration failed:', err);
        });
      });
    }
  </script>

  <script>
    // Override Flutter's default viewport meta that blocks pinch-to-zoom.
    // Flutter injects maximum-scale=1.0, user-scalable=no which is a WCAG
    // accessibility violation. We reset it after Flutter's bootstrap runs.
    window.addEventListener('flutter-first-frame', function() {
      var vp = document.querySelector('meta[name="viewport"]');
      if (vp) {
        vp.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
      }
    });
    // Also try immediately in case flutter-first-frame is delayed
    setTimeout(function() {
      var vp = document.querySelector('meta[name="viewport"]');
      if (vp && vp.getAttribute('content') && vp.getAttribute('content').indexOf('user-scalable=no') !== -1) {
        vp.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
      }
    }, 3000);
  </script>

<body>
  <!-- Instant HTML splash while Flutter downloads (perceived fast) -->
  <div id="av-html-splash" style="position:fixed;inset:0;background:#05070F;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.45s ease;">
    <div style="width:112px;height:112px;border-radius:32px;background:linear-gradient(135deg,#8B5CF6,#22D3EE);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(139,92,246,0.40);animation:av-pulse 1.6s ease infinite alternate;">
      <span style="font-size:56px;line-height:1;">🎨</span>
    </div>
    <div style="margin-top:28px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#fff;">ArtVault</div>
    <div style="margin-top:6px;font-size:11px;letter-spacing:1.6px;font-weight:600;color:rgba(255,255,255,0.45);">PRIVATE GALLERY • 3D</div>
    <div style="margin-top:28px;width:32px;height:2px;border-radius:99px;background:linear-gradient(90deg,rgba(139,92,246,0.5),rgba(255,255,255,0.5),rgba(139,92,246,0.5));opacity:0.6;"></div>
    <div style="margin-top:12px;font-size:11px;letter-spacing:1.2px;color:rgba(255,255,255,0.35);">Loading your gallery…</div>
    <style>@keyframes av-pulse { from { transform:scale(0.97);} to { transform:scale(1.03);} }</style>
  </div>
  <script>
    // Hide HTML splash once Flutter renders first frame
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('av-html-splash');
      if (el) { el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 500); }
    });
    // Fallback: hide after 8s even if event missed
    setTimeout(function(){ var el=document.getElementById('av-html-splash'); if(el) el.style.display='none'; }, 8000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
