<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ArtVault — Your private art collection manager. Track, catalogue, and manage your artwork with AI-powered insights.">

  <!-- Security Headers (meta-based — for full enforcement, configure your web server) -->
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

  <!-- Content Security Policy: restrict sources to prevent XSS -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.web.app;
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: blob: https://*.firebaseio.com https://*.firebasestorage.app https://*.supabase.co https://*.supabase.in;
    connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://*.firebaseio.com https://*.firebaseapp.com https://*.supabase.co https://*.supabase.in wss://*.firebaseio.com;
    frame-ancestors 'none';
    form-action 'none';
  ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#08090F">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ArtVault">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ArtVault — Art Collection Manager</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Sign-In web client (used by google_sign_in on web). -->
  <meta name="google-signin-client_id" content="1:629393260589:web:c964a2dac4fad408fdb8a4">

  <!-- Prevent clickjacking (full enforcement needs server-side X-Frame-Options: DENY) -->
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
    /* Prevent FOUC */
    body { background: #08090F; }
    /* Smooth scroll for anchor links */
    html { scroll-behavior: smooth; }
  </style>

  <script>
    // Session timeout: auto-logout after 30 minutes of inactivity
    (function() {
      var TIMEOUT_MS = 30 * 60 * 1000; // 30 minutes
      var timer;
      function resetTimer() {
        clearTimeout(timer);
        timer = setTimeout(function() {
          // Clear Firebase auth persistence
          try {
            localStorage.removeItem('firebase:authUser:AIzaSyAlEmaqwhaF9X49NX56Z5CtgznjYsa3r-Q:[DEFAULT]');
            sessionStorage.clear();
          } catch(e) {}
          // Reload to trigger auth state check
          window.location.reload();
        }, TIMEOUT_MS);
      }
      // Reset on any user activity
      ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart'].forEach(function(evt) {
        document.addEventListener(evt, resetTimer, { passive: true });
      });
      resetTimer();
    })();
  </script>

  <script>
    // Input sanitization helper — strips HTML tags from user input
    window.artvaultSanitize = function(str) {
      if (!str) return str;
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    };
  </script>

  <script>
    // Register service worker for offline support + push notifications
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          console.log('[ArtVault] Service worker registered, scope:', reg.scope);
        }).catch(function(err) {
          console.warn('[ArtVault] SW registration failed:', err);
        });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
