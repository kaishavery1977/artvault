name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fatal on infos)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage gate (>40% line)
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: ./coverage/lcov.info
          min_coverage: 40
          exclude: "**/*.g.dart **/generated/**"

      - name: Functions audit (high only)
        working-directory: functions
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Supabase RLS lint (if CLI present)
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase db lint --linked || echo "supabase lint skipped (not linked)"
          else
            echo "supabase CLI not installed — RLS lint skipped"
          fi
