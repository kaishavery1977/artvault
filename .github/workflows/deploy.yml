name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

# Cancel in-progress deploys when a new push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release

      # Deploys the app build (firebase.json hosting.public = build/web) to the
      # live channel of the project's default Hosting site.
      #
      # GitHub repo requirements:
      #   - Secret FIREBASE_SERVICE_ACCOUNT_ARTVAULT: JSON of a Google service
      #     account with Firebase Hosting Admin (roles/firebasehosting.admin,
      #     or firebase.admin).
      #   - Target project comes from the checked-in .firebaserc (artvault-d69d0).
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARTVAULT }}
          channelId: live
